[package]
name = "chrome-devtools"
version = "1.5.2"
edition = "2021"
description = "Profile-aware CLI for running Chrome DevTools MCP with isolated Chrome user data directories"
license = "Apache-2.0"
repository = "https://github.com/conao3/rust-chrome-devtools"

[[bin]]
name = "chrome-devtools"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
jmespath = "0.5.0"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
unicode-width = "0.2.3"
